name: Validate workflow templates
on:
  pull_request:
    paths:
      - 'workflow-templates/**'
      - 'scripts/validate_workflow_templates.py'
      - '.github/workflows/validate-workflow-templates.yml'
  push:
    branches: [main]
    paths:
      - 'workflow-templates/**'
      - 'scripts/validate_workflow_templates.py'
      - '.github/workflows/validate-workflow-templates.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-templates-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Install verified actionlint
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o actionlint.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum --check
          tar --no-same-owner -xzf actionlint.tar.gz actionlint
      - name: Validate templates and catalog
        run: python scripts/validate_workflow_templates.py --actionlint "$RUNNER_TEMP/actionlint"
