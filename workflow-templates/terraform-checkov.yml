name: Terraform Checkov
on:
  pull_request:
    branches: [$default-branch]
  push:
    branches: [$default-branch]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checkov-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: bridgecrewio/checkov-action@f967808197a8d784d3e72919f38c3ff0cda7884e # v12
        with:
          directory: .
          framework: terraform
          # Preserve reviewed exclusions/config_file and existing blocking policy.
          soft_fail: false
          download_external_modules: false
          skip_results_upload: true
          output_format: cli,sarif
          output_file_path: console,results.sarif
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: checkov-results
          path: results.sarif
          if-no-files-found: warn
          retention-days: 7
      # SARIF is retained locally as an artifact; no GitHub Advanced Security license assumed.
